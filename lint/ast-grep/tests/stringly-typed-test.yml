id: stringly-typed
valid:
  - "struct S { name: String }"
  - "struct S { kind: Kind }"
  - "struct S { status: Option<Status> }"
  - "fn f(label: &str) {}"
  - "fn f(mode: Mode) {}"
  - "mod tests { fn f(kind: &str) {} }"
  - "fn job_status() -> JobStatus { todo!() }"
invalid:
  - "struct S { kind: String }"
  - "struct S { pub job_status: Option<String> }"
  - "struct S<'a> { mode: &'a str }"
  - "fn f(state: &str) {}"
  - "fn f(r#type: String) {}"
  - "fn job_status() -> Option<String> { None }"
