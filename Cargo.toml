[workspace]
resolver = "3"
members = ["crates/*"]
# Not part of the product build: the rustc driver (its own workspace on a pinned nightly), the
# extractor scripts, the extractor test fixture (its own workspace), and extraction run outputs.
exclude = ["crates/driver", "extractors", "fixtures", "runs"]

[workspace.package]
license = "Apache-2.0"
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we don't want: noisy for an internal tool.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints we do want.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# rrr: exhaustive matches on enums, so new variants are compile errors.
wildcard_enum_match_arm = "warn"
