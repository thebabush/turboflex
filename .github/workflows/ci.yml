name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          (cd crates/driver && rustc -V)
      - run: npm install --global @ast-grep/cli@0.33.0
      - run: scripts/check.sh
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --locked
        working-directory: crates/driver
      - name: Bootstrap release binaries and check both workspaces
        run: scripts/self-check.sh

  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release CLI
        run: |
          rustup update stable
          cargo +stable build --release --locked -p turboflex
          tar -czf turboflex-linux-x86_64.tar.gz -C target/release turboflex
          sha256sum turboflex-linux-x86_64.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$TAG" --clobber turboflex-linux-x86_64.tar.gz SHA256SUMS
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json assets,isDraft |
            jq -e '(.isDraft == false) and
              (["SHA256SUMS","turboflex-linux-x86_64.tar.gz"] -
              [.assets[] | select(.state == "uploaded" and .size > 0) | .name] == [])'
